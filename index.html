<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>HTML</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="media.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <header class="header">
    <div class="navbar container">
      <div class="logo">
        <h2>MORENT</h2>
        <!--media quarry-->
        <div class="search-box-md">
          <div class="inputs-md">
            <input type="text" placeholder="Search something..." />
            <i class="fa-solid fa-magnifying-glass"></i>
            <div class="search-filter-md">
              <i class="fa-solid fa-sliders"></i>
            </div>
          </div>
          
        </div>
        <!--navbar icons -->
        <div class="nav-icon-md">
          <div class="nav-heart-md">
            <i class="fa-solid fa-heart" style="color: rgb(152, 152, 152);"></i>
          </div>
          <div class="nav-bell-md">
            <i class="fa-solid fa-bell" style="color: rgb(152, 152, 152);"></i>
          </div>
          <div class="nav-setting-md">
            <i class="fa-solid fa-gear" style="color: rgb(152, 152, 152);"></i>
          </div>
          
        </div>
        <!--media quarry end-->
        <img src="assets/pngwing.com (13).png" alt="shy" />
      </div>
      <!--search box-->
      <div class="search-box">
        <div class="inputs">
          <input type="text" placeholder="Search something..." />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="search-filter">
          <i class="fa-solid fa-sliders"></i>
        </div>
      </div>
      
    </div>
    
  </header>
  <!--Hero secrion-->
  <section class="hero-section container">
    <div class="hero-banner ">
      <div class="banner-content">
        <h3>The Best Platform for Car Rental</h3>
        <p>Ease of doing a car rental safely and reliably. Of course at a low price.</p>
        <button class="btn">
          <h4>Rental Car</h4>
        </button>
        <div class="hero-img">
          <img src="assets/pngwing.com (18).png" alt="" />
        </div>
      </div>
    </div>
  </section>
  
  <script src="main.js"></script>
</body>

</html>
